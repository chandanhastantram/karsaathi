services:
  - type: web
    name: karsaathi-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: KARSAATHI_TODAY
        value: "2026-11-16"
      - key: KARSAATHI_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
