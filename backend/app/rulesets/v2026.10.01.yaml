# KarSaathi rule set: GST rules as dated data.
# The model never decides a rate, a threshold or a due date. Code reads them from here,
# picks the entry valid on the document date, and cites `id` + `version` in every answer.
#
# NOTE: rate rows are a small demo table for a building-materials trader. Verify each
# rate against the current CBIC rate notification before using this outside a demo.

version: "2026.10.01"
published_on: "2026-10-01"
approved_by: "seed"
notes: "Base rule set for the SIH 2026 demo. Rates follow the GST rate rationalisation effective 22 Sep 2025 (5% / 18% / 40% slabs)."

hsn_rates:
